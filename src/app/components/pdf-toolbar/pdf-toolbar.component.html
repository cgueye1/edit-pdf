<div class="toolbar">

  <!-- ── Section 1 : Outils principaux ──────────────────────────────────── -->
  <div class="toolbar-section">
    <div class="tool-group">

      <button class="tool-btn" [class.active]="activeTool === 'text'" (click)="selectTool('text')"
              title="Texte">
        <i class="fas fa-keyboard"></i>
        <span class="tool-label">Texte</span>
      </button>

      <button class="tool-btn" [class.active]="activeTool === 'checkbox'" (click)="selectTool('checkbox')"
              title="Case à cocher">
        <i class="far fa-check-square"></i>
        <span class="tool-label">Case</span>
      </button>

      <button class="tool-btn" [class.active]="activeTool === 'image'" (click)="selectTool('image')"
              title="Ajouter une image">
        <i class="fas fa-image"></i>
        <span class="tool-label">Image</span>
      </button>

      <button class="tool-btn" [class.active]="activeTool === 'signature'" (click)="selectTool('signature')"
              title="Ajouter une signature">
        <i class="fas fa-signature"></i>
        <span class="tool-label">Signature</span>
      </button>

      <button class="tool-btn" [class.active]="activeTool === 'date'" (click)="selectTool('date')"
              title="Ajouter la date">
        <i class="fas fa-calendar-alt"></i>
        <span class="tool-label">Date</span>
      </button>

      <!-- ── Bouton Dessiner avec dropdown ────────────────────────────── -->
      <div class="draw-dropdown-wrapper" [class.active]="isDrawingToolActive()">

        <!-- Bouton principal -->
        <button
          class="tool-btn draw-main-btn"
          [class.active]="isDrawingToolActive()"
          (click)="toggleDrawingDropdown()"
          title="Outils de dessin">
          <i class="fas" [ngClass]="getActiveDrawIcon()"></i>
          <span class="tool-label">{{ getActiveDrawLabel() }}</span>
          <i class="fas fa-chevron-down chevron" [class.rotated]="showDrawingDropdown"></i>
        </button>

        <!-- Dropdown -->
        <div class="draw-dropdown" *ngIf="showDrawingDropdown" (click)="$event.stopPropagation()">

          <div class="draw-dropdown-title">Outils de dessin</div>

          <!-- Grille des outils -->
          <div class="draw-tools-grid">

            <button class="draw-tool-item" [class.active]="activeTool === 'highlight'"
                    (click)="selectDrawTool('highlight')">
              <div class="draw-tool-icon highlight-icon">
                <i class="fas fa-highlighter"></i>
              </div>
              <span>Surligner</span>
            </button>

            <button class="draw-tool-item" [class.active]="activeTool === 'draw'"
                    (click)="selectDrawTool('draw')">
              <div class="draw-tool-icon draw-icon">
                <i class="fas fa-pen"></i>
              </div>
              <span>Dessin libre</span>
            </button>

            <button class="draw-tool-item" [class.active]="activeTool === 'line'"
                    (click)="selectDrawTool('line')">
              <div class="draw-tool-icon line-icon">
                <i class="fas fa-minus"></i>
              </div>
              <span>Ligne</span>
            </button>

            <button class="draw-tool-item" [class.active]="activeTool === 'arrow'"
                    (click)="selectDrawTool('arrow')">
              <div class="draw-tool-icon arrow-icon">
                <i class="fas fa-long-arrow-alt-right"></i>
              </div>
              <span>Flèche</span>
            </button>

            <button class="draw-tool-item" [class.active]="activeTool === 'rectangle'"
                    (click)="selectDrawTool('rectangle')">
              <div class="draw-tool-icon rect-icon">
                <i class="far fa-square"></i>
              </div>
              <span>Rectangle</span>
            </button>

            <button class="draw-tool-item" [class.active]="activeTool === 'circle'"
                    (click)="selectDrawTool('circle')">
              <div class="draw-tool-icon circle-icon">
                <i class="far fa-circle"></i>
              </div>
              <span>Cercle</span>
            </button>



          </div>

          <!-- Séparateur + Options de style -->
          <div class="draw-options" *ngIf="activeTool && activeTool !== 'eraser' && isDrawingToolActive()">
            <div class="draw-options-title">Options</div>

            <div class="draw-option-row">
              <label>Couleur</label>
              <div class="color-row">
                <input type="color" [value]="drawingOptions.color"
                       (input)="onDrawingColorChange($any($event.target).value)">
                <div class="color-swatches">
                  <button *ngFor="let c of colorSwatches" class="swatch"
                          [style.background]="c"
                          [class.active]="drawingOptions.color === c"
                          (click)="onDrawingColorChange(c)">
                  </button>
                </div>
              </div>
            </div>

            <div class="draw-option-row">
              <label>Épaisseur <span class="option-val">{{ activeTool === 'highlight' ? (drawingOptions.lineWidth + ' pt') : (drawingOptions.lineWidth + 'px') }}</span></label>
              <input type="range" min="1" max="20" [value]="drawingOptions.lineWidth"
                     (input)="onDrawingLineWidthChange(parseInt($any($event.target).value, 10))">
            </div>

            <div class="draw-option-row" *ngIf="activeTool === 'highlight'">
              <label>Opacité <span class="option-val">{{ Math.round(drawingOptions.opacity * 100) }}%</span></label>
              <input type="range" min="0.05" max="1" step="0.05" [value]="drawingOptions.opacity"
                     (input)="onDrawingOpacityChange(parseFloat($any($event.target).value))">
            </div>



          </div>

        </div>
      </div>
      <!-- ── Fin dropdown dessin ────────────────────────────────────────── -->

      <button class="tool-btn" [class.active]="activeTool === 'select'" (click)="selectTool('select')"
              title="Déplacer un élément">
        <i class="fas fa-arrows-alt"></i>
        <span class="tool-label">Déplacer</span>
      </button>

      <button class="tool-btn" [class.active]="activeTool === 'eraser'"
              (click)="selectDrawTool('eraser')">
         <div class="draw-tool-icon eraser-icon">
          <i class="fas fa-eraser"></i>
        </div>
        <span class="tool-label">Effaceur</span>
      </button>

    </div>

    <!-- Barre d'outils texte contextuelle -->
    <div class="text-toolbar" *ngIf="activeTool === 'text' && showTextProperties">
      <div class="toolbar-group">
        <select class="toolbar-select" [value]="textProperties.fontFamily" (change)="onFontFamilyChange($event)" title="Police">
          <option *ngFor="let font of fontFamilies" [value]="font">{{ font }}</option>
        </select>
      </div>
      <div class="toolbar-group">
        <select class="toolbar-select toolbar-select-small" [value]="textProperties.fontSize" (change)="onFontSizeChange($event)" title="Taille">
          <option *ngFor="let size of fontSizes" [value]="size">{{ size }}</option>
        </select>
      </div>
      <div class="toolbar-group">
        <button class="toolbar-btn" [class.active]="textProperties.bold" (click)="onBoldToggle()" title="Gras">
          <i class="fas fa-bold"></i>
        </button>
        <button class="toolbar-btn" [class.active]="textProperties.italic" (click)="onItalicToggle()" title="Italique">
          <i class="fas fa-italic"></i>
        </button>
        <button class="toolbar-btn" [class.active]="textProperties.underline" (click)="onUnderlineToggle()" title="Souligné">
          <i class="fas fa-underline"></i>
        </button>
      </div>
      <div class="toolbar-group">
        <div class="color-picker-wrapper">
          <input type="color" [value]="textProperties.color" (change)="onColorChange($event)" class="color-picker" title="Couleur du texte">
          <div class="color-preview" [style.background-color]="textProperties.color"></div>
        </div>
      </div>
      <div class="toolbar-group">
        <div class="color-picker-wrapper">
          <input type="color"
                 [value]="textProperties.backgroundColor === 'transparent' ? '#ffffff' : textProperties.backgroundColor"
                 (change)="onBackgroundColorChange($event)" class="color-picker" title="Fond">
          <div class="color-preview"
               [style.background-color]="textProperties.backgroundColor === 'transparent' ? 'transparent' : textProperties.backgroundColor"
               [class.transparent]="textProperties.backgroundColor === 'transparent'">
            <i class="fas fa-ban" *ngIf="textProperties.backgroundColor === 'transparent'"></i>
          </div>
        </div>
      </div>
      <div class="toolbar-group">
        <button *ngFor="let align of textAlignments" class="toolbar-btn"
                [class.active]="textProperties.textAlign === align.value" (click)="onTextAlignChange(align.value)" [title]="align.label">
          <i class="fas fa-{{ align.icon }}"></i>
        </button>
      </div>
      <div class="toolbar-group">
        <button *ngFor="let align of verticalAlignments" class="toolbar-btn"
                [class.active]="textProperties.verticalAlign === align.value" (click)="onVerticalAlignChange(align.value)" [title]="align.label">
          <i class="fas fa-{{ align.icon }}"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Section 2 : Undo / Redo ──────────────────────────────────────── -->
  <div class="toolbar-section">
    <div class="tool-group">
      <button class="tool-btn" [class.disabled]="!canUndo" (click)="onUndo()" [title]="canUndo ? 'Annuler' : 'Rien à annuler'">
        <i class="fas fa-undo"></i>
      </button>
      <button class="tool-btn" [class.disabled]="!canRedo" (click)="onRedo()" [title]="canRedo ? 'Rétablir' : 'Rien à rétablir'">
        <i class="fas fa-redo"></i>
      </button>
    </div>
  </div>

  <!-- ── Section 3 : Pages ─────────────────────────────────────────────── -->
  <div class="toolbar-section">
    <div class="tool-group">
      <div class="page-controls" *ngIf="totalPages > 0">
        <button class="page-btn" (click)="previousPage()" [disabled]="currentPage === 1">
          <i class="fas fa-chevron-left"></i>
        </button>
        <div class="page-info">
          <span class="current-page">{{ currentPage }}</span>
          <span class="page-separator">/</span>
          <span class="total-pages">{{ totalPages }}</span>
        </div>
        <button class="page-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Section 4 : Actions ───────────────────────────────────────────── -->
  <div class="toolbar-section">
    <div class="tool-group">
      <button class="tool-btn btn-save" (click)="onSave()" title="Sauvegarder">
        <i class="fas fa-save"></i>
      </button>
      <button class="tool-btn btn-preview" (click)="onPreview()" title="Aperçu PDF">
        <i class="fas fa-eye"></i>
      </button>
      <button class="tool-btn btn-export" (click)="onExport()" title="Exporter PDF">
        <i class="fas fa-download"></i>
      </button>
      <button class="tool-btn btn-clear" (click)="onClear()" title="Tout effacer">
        <i class="fas fa-trash-alt"></i>
      </button>
      <button class="tool-btn btn-more-tools" (click)="onToggleProperties()" title="Plus d'options">
        <i class="fas fa-ellipsis-v"></i>
      </button>
    </div>
  </div>

</div>
